services:
  garmin-web:
    image: ghcr.io/palchrb/gm-webclient:latest
    # Or build locally:
    # build: .
    container_name: garmin-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - garmin-web-data:/data
    # Media conversion (ffmpeg) uses temp files; keep them in RAM so photos
    # and voice notes never hit persistent disk and vanish on restart.
    tmpfs:
      - /tmp:mode=1777,size=256m
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Restrict login to specific phone numbers (comma-separated, with country code).
      # Strongly recommended — without it anyone who finds the URL can log in
      # with their own Garmin account. Example: PHONE_WHITELIST=+4712345678,+4787654321
      - PHONE_WHITELIST=${PHONE_WHITELIST:-}
      # Days of inactivity before a login expires; renewed on every visit (default: 90)
      - SESSION_DAYS=${SESSION_DAYS:-90}
      # Key for the encrypted session file (Garmin tokens). If unset, one is generated
      # and stored in /data/session_key — fine for a personal box, but then the key
      # lives next to the file it protects. Set it yourself for real at-rest protection.
      - SESSION_KEY=${SESSION_KEY:-}
      # Origin URL for passkey (WebAuthn) support and ntfy click links.
      # Set to your public HTTPS URL to enable passkeys.
      # Example: ORIGIN=https://messenger.example.com
      - ORIGIN=${ORIGIN:-}
      # Push notification behavior. Default "false": push only when no tab is
      # visible (a backgrounded tab still gets push). Set "true" to also push
      # while you are looking at the app.
      - PUSH_ALWAYS=${PUSH_ALWAYS:-false}
      # ntfy.sh push notifications (optional). Set to your ntfy server URL to enable.
      # Notifications are sent alongside Web Push when messages arrive.
      # Example: NTFY_URL=https://ntfy.sh
      - NTFY_URL=${NTFY_URL:-}
      # Include full message body in ntfy notifications (default: false).
      # When false, only "New message" is sent for privacy.
      - NTFY_FULL_MESSAGE=${NTFY_FULL_MESSAGE:-false}
    command: ["/usr/bin/garmin-web", "-addr", ":8080", "-data-dir", "/data"]
    # Volume stores: encrypted Garmin tokens, passkey public keys, push
    # subscriptions, ntfy preferences, FCM device credentials, VAPID keys.
    # Never messages.

volumes:
  garmin-web-data:
    # Proxy via Caddy/nginx for HTTPS:
    #   messenger.example.com {
    #       reverse_proxy garmin-web:8080
    #   }
